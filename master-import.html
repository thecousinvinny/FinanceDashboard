const HEADERS   = ['Date','Type','Name','Description','Category','Cost','OCost','Savings','Card','Bank','Billing','Status','Source'];

function log(msg,cls='info'){
  const el=document.getElementById('log');
  el.style.display='block';
  el.innerHTML+=`<div class="${cls}">${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}
function prog(pct){
  document.getElementById('prog').style.display='block';
  document.getElementById('pbar').style.width=pct+'%';
}
function setBtn(txt,disabled){
  const b=document.getElementById('btn');
  b.textContent=txt;b.disabled=disabled;
}

async function run(){
  setBtn('Loading Google API…',true);

  await new Promise(res=>gapi.load('client',res));
  await gapi.client.init({
    apiKey:API_KEY,
    discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']
  });
  log('✓ API loaded');

  const gsiScript=document.createElement('script');
  gsiScript.src='https://accounts.google.com/gsi/client';
  document.head.appendChild(gsiScript);
  await new Promise(res=>gsiScript.onload=res);

  setBtn('Waiting for Google sign-in…',true);
  await new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:'https://www.googleapis.com/auth/spreadsheets',
      callback:(r)=>{
        if(r.error){log('Auth error: '+r.error,'err');rej(r.error);}
        else res();
      }
    });
    tc.requestAccessToken({prompt:'select_account'});
  });
  log('✓ Signed in');
  prog(8);

  // Step 1: Seed new categories
  setBtn('Adding new categories…',true);
  const catRes=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SHEET_ID,range:'Categories'});
  const existing=new Set((catRes.result.values||[]).slice(1).map(r=>(r[0]||'').trim()));
  let added=0;
  for(const[name,color] of NEW_CATS){
    if(!existing.has(name)){
      await gapi.client.sheets.spreadsheets.values.append({
        spreadsheetId:SHEET_ID,range:'Categories',
        valueInputOption:'USER_ENTERED',
        resource:{values:[[name,color]]}
      });
      log('+ Category: '+name,'ok');
      added++;
    } else {
      log('  Category already exists: '+name,'info');
    }
  }
  log(`✓ ${added} categories added`);
  prog(20);

  // Step 2: Ensure Master sheet + headers
  setBtn('Checking Master sheet…',true);
  const meta=await gapi.client.sheets.spreadsheets.get({spreadsheetId:SHEET_ID});
  const sheetNames=meta.result.sheets.map(s=>s.properties.title);
  if(!sheetNames.includes('Master')){
    await gapi.client.sheets.spreadsheets.batchUpdate({
      spreadsheetId:SHEET_ID,
      resource:{requests:[{addSheet:{properties:{title:'Master'}}}]}
    });
    log('+ Created Master sheet');
  }
  const masterCheck=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SHEET_ID,range:'Master'});
  const masterRows=masterCheck.result.values||[];
  if(masterRows.length===0){
    await gapi.client.sheets.spreadsheets.values.update({
      spreadsheetId:SHEET_ID,range:'Master!A1',
      valueInputOption:'USER_ENTERED',
      resource:{values:[HEADERS]}
    });
    log('+ Wrote Master headers');
  } else {
    log(`  Master already has ${masterRows.length-1} rows — appending after them`,'info');
  }
  prog(30);

  // Step 3: Batch append all rows
  setBtn('Writing '+ROWS.length+' rows…',true);
  log('Batch writing '+ROWS.length+' rows in one call…');
  try{
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId:SHEET_ID,
      range:'Master',
      valueInputOption:'USER_ENTERED',
      insertDataOption:'INSERT_ROWS',
      resource:{values:ROWS}
    });
    prog(100);
    log('✓ '+ROWS.length+' rows imported!','ok');
    log('Go back to your dashboard and click ↻ Sync','info');
    setBtn('✓ Done — delete this file from GitHub',true);
    document.getElementById('btn').style.background='#22c55e';
  }catch(e){
    log('Write failed: '+(e.result?.error?.message||e.message),'err');
    setBtn('Retry',false);
  }
}
