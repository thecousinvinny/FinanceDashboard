<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Master Ledger Sync</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0c0c0e;color:#ebebeb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
.card{background:#141416;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:40px;max-width:640px;width:100%}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
.sub{color:#8a8a9a;font-size:13px;margin-bottom:20px;line-height:1.7}
.box{background:#1c1c1f;border-radius:10px;padding:16px;margin-bottom:16px;font-size:12px;line-height:1.9;color:#8a8a9a}
.box b{color:#ebebeb}
.btn{width:100%;padding:14px;background:#6c63ff;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;margin-bottom:6px}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:16px;background:#1c1c1f;border-radius:10px;padding:16px;font-size:11px;font-family:monospace;max-height:380px;overflow-y:auto;line-height:1.9;display:none}
.ok{color:#22c55e}.err{color:#ef4444}.info{color:#8a8a9a}.warn{color:#f59e0b}
.progress{height:4px;background:#252529;border-radius:2px;margin-top:12px;display:none}
.pbar{height:100%;background:#6c63ff;border-radius:2px;width:0%;transition:width .25s}
</style>
</head>
<body>
<div class="card">
  <h1>🧹 Master Ledger Sync</h1>
  <div class="sub">Two operations — run in order.</div>
  <div class="box">
    <div>① <b>Sync Expenses → Master:</b> Matches by Name+Cost+Date (±3 days), fills OCost and Savings into Master.</div>
    <div style="margin-top:8px">② <b>Fix card strings:</b> Replaces "A.S (****1008)" style values with clean "A.S 1008" aliases across all sheets.</div>
  </div>
  <div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:12px 14px;font-size:12px;color:#f59e0b;margin-bottom:16px">
    ⚠️ Run once. Delete from GitHub after.
  </div>
  <button class="btn" id="btn1" onclick="runSync()">① Sync OCost + Savings → Master</button>
  <button class="btn" id="btn2" onclick="runCardFix()" style="background:#1c1c1f;border:1px solid rgba(255,255,255,.12)">② Fix card display strings</button>
  <div class="progress" id="prog"><div class="pbar" id="pbar"></div></div>
  <div class="log" id="log"></div>
</div>
<script src="https://apis.google.com/js/api.js"></script>
<script>
const API_KEY='AIzaSyDR31gST2VMxROFmWWe9GYWn0ySAWcbb18',CLIENT_ID='161473053231-fijc0tuqno4i3s21sjtlgcvr7d935sdv.apps.googleusercontent.com',SHEET_ID='1x8c8DgqsGERvgFif6S83bWacREdxKeoNkAFLCmwfxkc';

let _authed=false;
function log(msg,cls='info'){const el=document.getElementById('log');el.style.display='block';el.innerHTML+=`<div class="${cls}">${msg}</div>`;el.scrollTop=el.scrollHeight;}
function prog(pct){document.getElementById('prog').style.display='block';document.getElementById('pbar').style.width=pct+'%';}
function parseCost(s){return Math.round((parseFloat((s||'').replace(/[$,]/g,''))||0)*100)/100;}
function toISO(s){s=(s||'').trim();const p=s.split('/');if(p.length===3)return p[2]+'-'+p[0].padStart(2,'0')+'-'+p[1].padStart(2,'0');return s;}
function dateDiff(a,b){try{return Math.abs(new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5;}catch{return 999;}}

async function auth(){
  if(_authed)return;
  await new Promise(res=>gapi.load('client',res));
  await gapi.client.init({apiKey:API_KEY,discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});
  const gs=document.createElement('script');gs.src='https://accounts.google.com/gsi/client';document.head.appendChild(gs);
  await new Promise(res=>gs.onload=res);
  await new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets',callback:r=>r.error?rej(r.error):res()});
    tc.requestAccessToken({prompt:'select_account'});
  });
  _authed=true;
  log('✓ Connected');
}

async function readSheet(name){
  const r=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SHEET_ID,range:`${name}!A1:Z10000`});
  return r.result.values||[];
}

async function batchWrite(data){
  await gapi.client.sheets.spreadsheets.values.batchUpdate({
    spreadsheetId:SHEET_ID,
    resource:{valueInputOption:'USER_ENTERED',data}
  });
}

async function runSync(){
  document.getElementById('btn1').disabled=true;
  document.getElementById('btn1').textContent='Running…';
  await auth();prog(5);

  log('Reading Expenses…');
  const expRows=await readSheet('Expenses');
  const eH=expRows[0]||[];
  const eN=eH.indexOf('Name'),eD=eH.indexOf('Description'),eC=eH.indexOf('Cost'),
        eDt=eH.indexOf('Date'),eO=eH.indexOf('OCost'),eSv=eH.indexOf('Savings');
  log(`Expenses cols — Name:${eN} Desc:${eD} Cost:${eC} Date:${eDt} OCost:${eO} Savings:${eSv}`,'info');

  // Only expenses that have OCost or Savings to contribute
  const expenses=expRows.slice(1).map(r=>({
    name:(r[eN]||'').trim().toLowerCase(),
    desc:(r[eD]||'').trim().toLowerCase(),
    cost:parseCost(r[eC]),
    date:toISO(r[eDt]||''),
    ocost:parseCost(r[eO]),
    savings:parseCost(r[eSv]),
  })).filter(e=>e.cost>0&&(e.ocost||e.savings));
  log(`Expenses with OCost or Savings: ${expenses.length}`);prog(15);

  log('Reading Master…');
  const mastRows=await readSheet('Master');
  const mH=mastRows[0]||[];
  const mDt=mH.indexOf('Date'),mNm=mH.indexOf('Name'),mDe=mH.indexOf('Description'),
        mCo=mH.indexOf('Cost'),mOC=mH.indexOf('OCost'),mSv=mH.indexOf('Savings');
  log(`Master cols — Date:${mDt} Name:${mNm} Cost:${mCo} OCost:${mOC} Savings:${mSv}`,'info');
  prog(25);

  // Index master rows for fast lookup
  const masterIndex=mastRows.slice(1).map((r,i)=>({
    rowNum:i+2,
    name:(r[mNm]||'').trim().toLowerCase(),
    cost:parseCost(r[mCo]),
    date:toISO(r[mDt]||''),
    row:r,
  }));

  let matched=0,noMatch=0,unchanged=0;
  const batchData=[];
  const usedRows=new Set();

  for(const exp of expenses){
    const hit=masterIndex.find(m=>{
      if(usedRows.has(m.rowNum))return false;
      const nameMatch=m.name===exp.name||m.name===exp.desc;
      if(!nameMatch)return false;
      if(Math.abs(m.cost-exp.cost)>0.02)return false;
      if(exp.date&&m.date&&dateDiff(exp.date,m.date)>3)return false;
      return true;
    });

    if(!hit){noMatch++;continue;}
    usedRows.add(hit.rowNum);

    const newRow=[...hit.row];
    while(newRow.length<=Math.max(mOC,mSv))newRow.push('');

    let changed=false;
    if(exp.ocost&&newRow[mOC]!==String(exp.ocost)){newRow[mOC]=String(exp.ocost);changed=true;}
    if(exp.savings&&newRow[mSv]!==String(exp.savings)){newRow[mSv]=String(exp.savings);changed=true;}

    if(!changed){unchanged++;continue;}
    hit.row=newRow;
    const endCol=String.fromCharCode(65+newRow.length-1);
    batchData.push({range:`Master!A${hit.rowNum}:${endCol}${hit.rowNum}`,values:[newRow]});
    matched++;
  }

  log(`✅ Matched: ${matched}  ⬜ No match: ${noMatch}  ⏭ Unchanged: ${unchanged}`,'ok');
  prog(50);

  if(batchData.length){
    const BATCH=100;
    for(let i=0;i<batchData.length;i+=BATCH){
      await batchWrite(batchData.slice(i,i+BATCH));
      prog(50+Math.round(((i+BATCH)/batchData.length)*45));
      log(`  Wrote ${Math.min(i+BATCH,batchData.length)}/${batchData.length}`,'info');
    }
  }
  prog(100);
  log(`✓ Done! ${matched} Master rows updated.`,'ok');
  document.getElementById('btn1').textContent='✓ Done';
}

async function runCardFix(){
  document.getElementById('btn2').disabled=true;
  document.getElementById('btn2').textContent='Running…';
  await auth();prog(5);

  // Fix "A.S (****1008)" → "A.S 1008"
  function fixCard(val){
    if(!val)return val;
    const m=val.match(/^(.+?)\s*\(\*{4}(\d+)\)$/);
    if(m)return m[1].trim()+' '+m[2].trim();
    return val;
  }

  let totalFixed=0;
  for(const shName of ['Expenses','Subscriptions','Master']){
    log(`Scanning ${shName}…`);
    const rows=await readSheet(shName);
    const h=rows[0]||[];
    const iCard=h.indexOf('Card');
    if(iCard<0){log(`  No Card column in ${shName}`,'warn');continue;}

    const updates=[];
    rows.slice(1).forEach((r,i)=>{
      const val=r[iCard]||'';
      const fixed=fixCard(val);
      if(fixed!==val){
        const newRow=[...r];
        newRow[iCard]=fixed;
        const endCol=String.fromCharCode(65+newRow.length-1);
        updates.push({range:`${shName}!A${i+2}:${endCol}${i+2}`,values:[newRow]});
      }
    });

    if(updates.length){
      const BATCH=100;
      for(let i=0;i<updates.length;i+=BATCH) await batchWrite(updates.slice(i,i+BATCH));
      log(`  Fixed ${updates.length} rows in ${shName}`,'ok');
      totalFixed+=updates.length;
    } else {
      log(`  No fixable values in ${shName}`,'info');
    }
    prog(20+['Expenses','Subscriptions','Master'].indexOf(shName)*25);
  }

  prog(100);
  log(`✓ Done! ${totalFixed} card values cleaned.`,'ok');
  log('Go to dashboard → ↻ Sync','info');
  document.getElementById('btn2').textContent='✓ Done';
}
</script>
</body>
</html>
